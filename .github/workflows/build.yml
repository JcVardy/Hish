name: Build Hish

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux audio/GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate build output (Windows)
        if: runner.os == 'Windows'
        run: echo "ARTIFACT_PATH=build/Hish_artefacts/Release" >> $env:GITHUB_ENV

      - name: Locate build output (macOS/Linux)
        if: runner.os != 'Windows'
        run: echo "ARTIFACT_PATH=build/Hish_artefacts/Release" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hish-${{ matrix.os }}
          path: ${{ env.ARTIFACT_PATH }}